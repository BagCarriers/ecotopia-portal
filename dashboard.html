<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Ecotopia</title>
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="assets/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/mapping.js"></script>
<script src="assets/auth.js"></script>
<script>if (!AuthManager.hasCachedSession()) location.replace('login.html');</script>
<script src="assets/data.js"></script>
<script src="assets/nav.js"></script>
<style>
  :root {
    --forest: #1B4332; --forest-mid: #2D6A4F; --forest-light: #52B788;
    --sage: #D8F3DC; --sage-dim: #B7E4C7; --earth: #8B5E3C;
    --earth-light: #C68642; --gold: #F4A261; --cream: #F9F6F0;
    --cream-dim: #E8E0D5; --text: #1C1C1C; --text-dim: #5A5A5A;
    --border: rgba(45,106,79,0.2);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); }
  .page { padding: 28px 32px; max-width: 1100px; }
  h1 { font-family: 'Fraunces', serif; font-size: 1.9rem; color: var(--forest); margin-bottom: 4px; }
  .subtitle { color: var(--text-dim); font-size: 0.95rem; margin-bottom: 28px; }

  /* Stat cards */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .stat-card {
    background: #fff; border-radius: 12px; padding: 20px 22px;
    border: 1px solid var(--border); position: relative; overflow: hidden;
  }
  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  }
  .stat-card.green::before { background: var(--forest-light); }
  .stat-card.amber::before { background: var(--gold); }
  .stat-card.blue::before { background: #60a5fa; }
  .stat-card.red::before { background: #f87171; }
  .stat-label { font-size: 0.78rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 8px; }
  .stat-value { font-family: 'Fraunces', serif; font-size: 2.4rem; font-weight: 600;
    color: var(--forest); line-height: 1; }
  .stat-sub { font-size: 0.8rem; color: var(--text-dim); margin-top: 4px; }

  /* Sections */
  .sections { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .section-wide { grid-column: 1 / -1; }
  .card {
    background: #fff; border-radius: 12px; border: 1px solid var(--border); overflow: hidden;
  }
  .card-header {
    padding: 16px 20px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-header h3 { font-family: 'Fraunces', serif; font-size: 1.05rem; color: var(--forest); }
  .card-body { padding: 0; }

  /* Task rows */
  .task-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
  }
  .task-row:last-child { border-bottom: none; }
  .due-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .due-dot.red { background: #ef4444; }
  .due-dot.amber { background: #f59e0b; }
  .due-dot.green { background: var(--forest-light); }
  .task-info { flex: 1; min-width: 0; }
  .task-title { font-size: 0.9rem; font-weight: 500; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .task-garden { font-size: 0.78rem; color: var(--text-dim); }
  .task-due { font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
  .task-due.red { color: #ef4444; }
  .task-due.amber { color: #d97706; }
  .task-due.green { color: var(--forest-mid); }

  /* Activity rows */
  .activity-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
  }
  .activity-row:last-child { border-bottom: none; }
  .activity-avatar {
    width: 32px; height: 32px; background: var(--sage);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 600; color: var(--forest); flex-shrink: 0;
  }
  .activity-info { flex: 1; min-width: 0; }
  .activity-name { font-size: 0.875rem; font-weight: 500; }
  .activity-detail { font-size: 0.78rem; color: var(--text-dim); }
  .activity-time { font-size: 0.75rem; color: var(--text-dim); white-space: nowrap; }

  /* Attention items */
  .attention-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px; border-bottom: 1px solid var(--border);
  }
  .attention-item:last-child { border-bottom: none; }
  .attention-badge {
    padding: 2px 8px; border-radius: 20px; font-size: 0.72rem; font-weight: 600;
    white-space: nowrap;
  }
  .badge-red { background: #fee2e2; color: #dc2626; }
  .badge-amber { background: #fef3c7; color: #d97706; }
  .badge-blue { background: #dbeafe; color: #1d4ed8; }
  .attention-text { font-size: 0.875rem; flex: 1; }
  .attention-link { font-size: 0.8rem; color: var(--forest-mid); text-decoration: none; font-weight: 500; }
  .attention-link:hover { text-decoration: underline; }

  /* Quick actions */
  .quick-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
  .btn-quick {
    padding: 10px 18px; border-radius: 8px; border: 1.5px solid var(--forest-light);
    background: #fff; color: var(--forest); font-size: 0.875rem; font-weight: 600;
    cursor: pointer; font-family: 'DM Sans', sans-serif; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.15s;
  }
  .btn-quick:hover { background: var(--sage); }
  .btn-quick.primary { background: var(--forest); color: #fff; border-color: var(--forest); }
  .btn-quick.primary:hover { background: var(--forest-mid); }

  .empty { padding: 20px; color: var(--text-dim); font-size: 0.875rem; text-align: center; }

  @media (max-width: 900px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .sections { grid-template-columns: 1fr; }
    .section-wide { grid-column: auto; }
  }
  @media (max-width: 600px) {
    .page { padding: 20px 16px; }
    .stats-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat-value { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="page">
  <h1>Good morning, Jordan</h1>
  <p class="subtitle" id="dateSubtitle"></p>

  <!-- Stats -->
  <div class="stats-row" id="statsRow"></div>

  <!-- Sections -->
  <div class="sections">
    <!-- My Workload Today -->
    <div class="card">
      <div class="card-header"><h3>My Workload Today</h3></div>
      <div class="card-body" id="myWorkload"></div>
    </div>

    <!-- Needs Attention -->
    <div class="card">
      <div class="card-header"><h3>Needs Attention</h3></div>
      <div class="card-body" id="needsAttention"></div>
    </div>

    <!-- Recent Activity -->
    <div class="card section-wide">
      <div class="card-header">
        <h3>Recent Activity</h3>
        <a href="reports.html" style="font-size:0.8rem;color:var(--forest-mid);text-decoration:none;">View all →</a>
      </div>
      <div class="card-body" id="recentActivity"></div>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="quick-actions">
    <a href="jobs.html" class="btn-quick primary">+ New Job</a>
    <a href="clients.html" class="btn-quick">+ New Client</a>
    <a href="reports.html" class="btn-quick">📊 View Reports</a>
    <a href="volunteers.html" class="btn-quick">🤝 Log Hours</a>
  </div>
</div>

<script>
(async function init() {
const esc = DataStore.esc;
try {
  await AuthManager.requireAuth();
  Nav.render();

  // Date subtitle
  const now = new Date();
  document.getElementById('dateSubtitle').textContent =
    now.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });

  const [gardens, jobs, invoices, unpaidInvoicesList, jordanTasksList, openTasksList, recentCheckins, upcomingEventsList, observations, plantingSuggestions] =
    await Promise.all([
      DataStore.getGardens(), DataStore.getJobs(), DataStore.getInvoices(),
      DataStore.getUnpaidInvoices(), DataStore.getJordanTasks(), DataStore.getOpenTasks(),
      DataStore.getRecentCheckins(5), DataStore.getUpcomingEvents(), DataStore.getObservations(),
      DataStore.getPlantingSuggestions(),
    ]);

  // Stats
  const activeJobs = jobs.filter(j => j.status === 'active').length;
  const openTasks = openTasksList.length;
  const upcomingEvents = upcomingEventsList.length;
  const unpaidInvoices = unpaidInvoicesList.length;

  document.getElementById('statsRow').innerHTML = `
  <div class="stat-card green">
    <div class="stat-label">Active Jobs</div>
    <div class="stat-value">${activeJobs}</div>
    <div class="stat-sub">in progress</div>
  </div>
  <div class="stat-card amber">
    <div class="stat-label">Open Tasks</div>
    <div class="stat-value">${openTasks}</div>
    <div class="stat-sub">unclaimed</div>
  </div>
  <div class="stat-card blue">
    <div class="stat-label">Upcoming Events</div>
    <div class="stat-value">${upcomingEvents}</div>
    <div class="stat-sub">scheduled</div>
  </div>
  <div class="stat-card ${unpaidInvoices > 0 ? 'red' : 'green'}">
    <div class="stat-label">Unpaid Invoices</div>
    <div class="stat-value">${unpaidInvoices}</div>
    <div class="stat-sub">outstanding</div>
  </div>
`;

// My Workload - Jordan's tasks
const jordanTasks = jordanTasksList.slice().sort((a, b) => new Date(a.nextDue) - new Date(b.nextDue));
function gardenName(gId) { return (gardens.find(g => g.id === gId) || {}).name || ''; }

function dueCls(days) {
  if (days === null) return 'green';
  if (days <= 0) return 'red';
  if (days <= 3) return 'amber';
  return 'green';
}
function dueLabel(days) {
  if (days === null) return '';
  if (days < 0) return `${Math.abs(days)}d overdue`;
  if (days === 0) return 'Due today';
  return `In ${days}d`;
}

const workloadEl = document.getElementById('myWorkload');
if (jordanTasks.length === 0) {
  workloadEl.innerHTML = '<div class="empty">No tasks assigned to Jordan.</div>';
} else {
  workloadEl.innerHTML = jordanTasks.map(t => {
    const d = DataStore.daysUntil(t.nextDue);
    const cls = dueCls(d);
    return `
      <div class="task-row">
        <div class="due-dot ${cls}"></div>
        <div class="task-info">
          <div class="task-title">${esc(t.title)}</div>
          <div class="task-garden">${esc(gardenName(t.gardenId))}</div>
        </div>
        <div class="task-due ${cls}">${dueLabel(d)}</div>
      </div>`;
  }).join('');
}

// Recent Activity
const activityEl = document.getElementById('recentActivity');
if (recentCheckins.length === 0) {
  activityEl.innerHTML = '<div class="empty">No recent check-ins.</div>';
} else {
  activityEl.innerHTML = recentCheckins.map(ci => {
    const initials = ci.volunteerName.split(' ').map(w => w[0]).join('').slice(0, 2);
    const timeAgo = (() => {
      const diff = Date.now() - new Date(ci.checkInTime).getTime();
      const d = Math.floor(diff / 86400000);
      if (d === 0) return 'Today';
      if (d === 1) return 'Yesterday';
      return `${d} days ago`;
    })();
    return `
      <div class="activity-row">
        <div class="activity-avatar">${esc(initials)}</div>
        <div class="activity-info">
          <div class="activity-name">${esc(ci.volunteerName)}</div>
          <div class="activity-detail">${esc(ci.taskTitle)} · ${esc(ci.gardenName)}</div>
        </div>
        <div class="activity-time">${timeAgo}</div>
      </div>`;
  }).join('');
}

// Needs Attention
const attentionItems = [];
if (openTasksList.length > 0) {
  attentionItems.push({
    badge: 'amber', label: 'Needs Owner',
    text: `${openTasksList.length} task${openTasksList.length > 1 ? 's' : ''} unclaimed across gardens`,
    link: 'gardens.html', linkText: 'Assign →'
  });
}
const overdueInv = invoices.filter(i => i.status === 'overdue');
if (overdueInv.length > 0) {
  attentionItems.push({
    badge: 'red', label: 'Overdue',
    text: `${overdueInv.length} invoice${overdueInv.length > 1 ? 's' : ''} past due`,
    link: 'invoices.html', linkText: 'View →'
  });
}
const flaggedObs = observations.filter(o => o.flagged);
if (flaggedObs.length > 0) {
  attentionItems.push({
    badge: 'amber', label: 'Flagged',
    text: `${flaggedObs.length} plant observation${flaggedObs.length > 1 ? 's' : ''} need review`,
    link: 'gardens.html', linkText: 'Review →'
  });
}
const pendingJobs = jobs.filter(j => j.status === 'inquiry');
if (pendingJobs.length > 0) {
  attentionItems.push({
    badge: 'blue', label: 'New Inquiry',
    text: `${pendingJobs.length} job inquiry waiting for follow-up`,
    link: 'jobs.html', linkText: 'View →'
  });
}
const newSuggestions = plantingSuggestions.filter(s => s.status === 'new');
if (newSuggestions.length > 0) {
  attentionItems.push({
    badge: 'blue', label: 'New Suggestion',
    text: `${newSuggestions.length} new planting suggestion${newSuggestions.length > 1 ? 's' : ''}`,
    link: 'gardens.html', linkText: 'Review →'
  });
}

const attentionEl = document.getElementById('needsAttention');
if (attentionItems.length === 0) {
  attentionEl.innerHTML = '<div class="empty">All clear. Nothing needs immediate attention.</div>';
} else {
  attentionEl.innerHTML = attentionItems.map(item => `
    <div class="attention-item">
      <span class="attention-badge badge-${item.badge}">${item.badge === 'red' ? '!' : item.badge === 'amber' ? '△' : 'i'} ${item.label}</span>
      <span class="attention-text">${item.text}</span>
      <a href="${item.link}" class="attention-link">${item.linkText}</a>
    </div>`).join('');
}
} catch (err) {
  document.getElementById('statsRow').innerHTML =
    '<div class="empty">Could not load data (' + esc(err.message) + '). <a href="javascript:location.reload()">Retry</a></div>';
}
})();
</script>

<!-- Bag Carriers thin powered-by footer (locked attribution component) -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet">
<style>
.bc-thinfoot {
  --bc-ink:#0a0c10; --bc-bone:#f0ece4; --bc-sienna:#7a4520; --bc-muted:#8a8172;
  flex: 0 0 auto;
  background:var(--bc-ink);
  font-family:'Bebas Neue',sans-serif;
  padding:12px 20px;
  display:flex; align-items:center; justify-content:center; gap:8px;
  border-top:2px solid var(--bc-sienna);
  text-align:center;
}
.bc-thinfoot__label {
  font-family:'Libre Baskerville',serif; font-style:italic;
  font-size:11px; letter-spacing:.02em; color:var(--bc-muted);
}
.bc-thinfoot__mark {
  font-family:'Bebas Neue',sans-serif; letter-spacing:.08em;
  font-size:15px; line-height:1; color:var(--bc-bone);
  text-decoration:none;
}
.bc-thinfoot__mark:hover { opacity:.85; }
.bc-thinfoot__mark .bc-systems { color:var(--bc-sienna); }
.bc-thinfoot__mark .bc-dot { color:var(--bc-sienna); }
</style>
<footer class="bc-thinfoot">
  <span class="bc-thinfoot__label">Powered by</span>
  <a class="bc-thinfoot__mark" href="https://bagcarriers.com/systems" target="_blank" rel="noopener">
    BAG CARRIERS <span class="bc-systems">SYSTEMS</span><span class="bc-dot">.</span>
  </a>
</footer>
</body>
</html>
