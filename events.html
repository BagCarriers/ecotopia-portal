<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events — Ecotopia</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="assets/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/mapping.js"></script>
<script src="assets/auth.js"></script>
<script>if (!AuthManager.hasCachedSession()) location.replace('login.html');</script>
<script src="assets/data.js"></script>
<script src="assets/nav.js"></script>
<style>
  :root {
    --forest: #1B4332; --forest-mid: #2D6A4F; --forest-light: #52B788;
    --sage: #D8F3DC; --sage-dim: #B7E4C7; --earth: #8B5E3C;
    --earth-light: #C68642; --gold: #F4A261; --cream: #F9F6F0;
    --cream-dim: #E8E0D5; --text: #1C1C1C; --text-dim: #5A5A5A;
    --border: rgba(45,106,79,0.2);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); }
  .page { padding: 28px 32px; max-width: 800px; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  h1 { font-family: 'Fraunces', serif; font-size: 1.9rem; color: var(--forest); }
  .btn { padding: 10px 18px; border-radius: 8px; border: none; font-size: 0.875rem;
    font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif;
    text-decoration: none; display: inline-flex; gap: 6px; align-items: center;
    transition: background 0.15s; }
  .btn-primary { background: var(--forest); color: #fff; }
  .btn-primary:hover { background: var(--forest-mid); }

  /* Event cards */
  .event-list { display: flex; flex-direction: column; gap: 14px; }
  .event-card {
    background: #fff; border-radius: 14px; border: 1px solid var(--border);
    padding: 20px 22px; display: flex; gap: 20px; align-items: flex-start;
  }
  .event-date-block {
    background: var(--forest); color: #fff; border-radius: 10px;
    padding: 10px 14px; text-align: center; min-width: 56px; flex-shrink: 0;
  }
  .event-month { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.8; }
  .event-day { font-family: 'Fraunces', serif; font-size: 1.8rem; font-weight: 700; line-height: 1; }
  .event-info { flex: 1; }
  .event-title { font-family: 'Fraunces', serif; font-size: 1.1rem; color: var(--forest);
    margin-bottom: 4px; }
  .event-type-pill { padding: 2px 8px; border-radius: 20px; font-size: 0.72rem; font-weight: 600;
    margin-bottom: 6px; display: inline-block; }
  .type-workday { background: #d1fae5; color: #065f46; }
  .type-plant_sale { background: #fef3c7; color: #92400e; }
  .type-workshop { background: #dbeafe; color: #1e40af; }
  .type-other { background: var(--cream-dim); color: var(--text-dim); }
  .event-location { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 6px; }
  .event-desc { font-size: 0.85rem; color: var(--text-dim); line-height: 1.5; margin-bottom: 10px; }
  .event-meta { display: flex; align-items: center; gap: 12px; }
  .signup-count { font-size: 0.82rem; color: var(--forest-mid); font-weight: 600; }
  .signup-names { font-size: 0.78rem; color: var(--text-dim); }
  .btn-signup { padding: 6px 14px; border-radius: 6px; background: var(--sage);
    color: var(--forest); border: none; font-size: 0.8rem; font-weight: 600;
    cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s; }
  .btn-signup:hover { background: var(--sage-dim); }

  .past-header { font-size: 0.85rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-dim); margin: 24px 0 12px; }

  /* New event form */
  .inline-form {
    background: #fff; border-radius: 14px; border: 1px solid var(--border);
    padding: 24px; margin-bottom: 24px; display: none;
  }
  .inline-form.open { display: block; }
  .inline-form h3 { font-family: 'Fraunces', serif; color: var(--forest); margin-bottom: 16px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 0.78rem; font-weight: 600;
    color: var(--text-dim); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 9px 11px; border-radius: 7px;
    border: 1.5px solid var(--border); font-size: 0.875rem; font-family: 'DM Sans', sans-serif; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: var(--forest-light); }
  .form-actions { display: flex; gap: 10px; }
  .btn-cancel { background: var(--cream-dim); color: var(--text); padding: 10px 18px;
    border-radius: 8px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .success-msg { background: #d1fae5; border: 1px solid #6ee7b7; color: #065f46;
    padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; display: none; font-size: 0.875rem; }
  .success-msg.visible { display: block; }

  /* Edit button */
  .btn-edit { font-size: 0.8rem; padding: 4px 10px; background: transparent;
    border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
    color: var(--text-dim); font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .btn-edit:hover { color: var(--forest); border-color: var(--forest-light); background: var(--sage); }

  /* Edit modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    z-index: 500; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 16px; padding: 28px;
    width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .modal h2 { font-family: 'Fraunces', serif; color: var(--forest); margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .btn-cancel { background: var(--cream-dim); color: var(--text); padding: 10px 18px;
    border-radius: 8px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .modal-error { color: #b3261e; font-size: 0.85rem; margin-top: 8px; }

  @media (max-width: 600px) {
    .page { padding: 20px 16px; }
    .event-card { flex-direction: column; gap: 12px; }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <h1>Events</h1>
    <button class="btn btn-primary" onclick="toggleForm()">+ New Event</button>
  </div>

  <!-- Inline form -->
  <div class="inline-form" id="newEventForm">
    <h3>New Event</h3>
    <div class="success-msg" id="eventSuccess">Event created!</div>
    <form id="eventFormEl" novalidate>
      <div class="form-row">
        <div class="form-group"><label>Title *</label>
          <input type="text" id="ev_title" placeholder="Event name" required></div>
        <div class="form-group"><label>Date *</label>
          <input type="date" id="ev_date" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Garden / Location</label>
          <select id="ev_garden"></select></div>
        <div class="form-group"><label>Type</label>
          <select id="ev_type">
            <option value="workday">Volunteer Workday</option>
            <option value="plant_sale">Plant Sale</option>
            <option value="workshop">Workshop</option>
            <option value="other">Other</option>
          </select></div>
      </div>
      <div class="form-group"><label>Description</label>
        <textarea id="ev_desc" rows="2" placeholder="Event details…"></textarea></div>
      <div class="modal-error" id="eventFormError"></div>
      <div class="form-actions">
        <button type="button" class="btn-cancel" onclick="toggleForm()">Cancel</button>
        <button type="submit" class="btn btn-primary">Create Event</button>
      </div>
    </form>
  </div>

  <div class="modal-error" id="eventPageError"></div>
  <div id="eventList"></div>
</div>

<!-- Edit Event Modal -->
<div class="modal-overlay" id="editEventModal">
  <div class="modal">
    <h2>Edit Event</h2>
    <form id="editEventForm" novalidate>
      <div class="form-group"><label>Title *</label>
        <input type="text" id="ee_title" placeholder="Event name" required></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group"><label>Type</label>
          <select id="ee_type">
            <option value="workday">Volunteer Workday</option>
            <option value="plant_sale">Plant Sale</option>
            <option value="workshop">Workshop</option>
            <option value="other">Other</option>
          </select></div>
        <div class="form-group"><label>Date *</label>
          <input type="date" id="ee_date" required></div>
      </div>
      <div class="form-group"><label>Location</label>
        <input type="text" id="ee_location" placeholder="Location or garden name"></div>
      <div class="form-group"><label>Description</label>
        <textarea id="ee_desc" rows="3" placeholder="Event details…"
          style="width:100%;padding:9px 11px;border-radius:7px;border:1.5px solid var(--border);font-size:0.875rem;font-family:'DM Sans',sans-serif;"></textarea></div>
      <div class="form-group"><label>Volunteer Count Target</label>
        <input type="number" id="ee_vol_count" min="0" placeholder="e.g. 10"
          style="width:100%;padding:9px 11px;border-radius:7px;border:1.5px solid var(--border);font-size:0.875rem;font-family:'DM Sans',sans-serif;"></div>
      <input type="hidden" id="ee_id">
      <div class="modal-error" id="editEventError"></div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeEditEvent()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<script>
const esc = DataStore.esc;
let events = [], gardens = [];

function populateGardenDropdown() {
  const gardenSel = document.getElementById('ev_garden');
  gardenSel.innerHTML = `<option value="">None / other</option>` +
    gardens.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('');
}

function renderEvents() {
  const sorted = events.slice().sort((a, b) => a.date.localeCompare(b.date));
  const today = new Date().toISOString().slice(0, 10);
  const upcoming = sorted.filter(e => e.date >= today);
  const past = sorted.filter(e => e.date < today);
  const el = document.getElementById('eventList');

  function typeLabel(t) {
    const m = { workday: 'Workday', plant_sale: 'Plant Sale', workshop: 'Workshop', other: 'Event' };
    return m[t] || 'Event';
  }

  function cardHtml(ev) {
    const d = new Date(ev.date + 'T12:00:00');
    const month = d.toLocaleDateString('en-US', { month: 'short' }).toUpperCase();
    const day = d.getDate();
    const garden = ev.gardenId ? gardens.find(g => g.id === ev.gardenId) : null;
    const loc = ev.location || ev.gardenName || (garden ? garden.name : '') || 'Location TBD';
    const signups = ev.signups || [];
    return `
      <div class="event-card">
        <div class="event-date-block">
          <div class="event-month">${month}</div>
          <div class="event-day">${day}</div>
        </div>
        <div class="event-info">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
            <div class="event-title">${esc(ev.title)}</div>
            <button class="btn-edit" onclick="openEditEvent('${ev.id}')">✏️ Edit</button>
          </div>
          <span class="event-type-pill type-${ev.type}">${typeLabel(ev.type)}</span>
          <div class="event-location">📍 ${esc(loc)}</div>
          ${ev.description ? `<div class="event-desc">${esc(ev.description)}</div>` : ''}
          <div class="event-meta">
            <span class="signup-count">🤝 ${signups.length} signed up</span>
            ${signups.length > 0 ? `<span class="signup-names">${signups.slice(0,3).map(esc).join(', ')}${signups.length > 3 ? ` +${signups.length-3}` : ''}</span>` : ''}
            ${ev.openSignup ? `<button class="btn-signup" onclick="quickSignup('${ev.id}')">Sign up</button>` : ''}
          </div>
        </div>
      </div>`;
  }

  let html = '';
  if (upcoming.length === 0) {
    html += '<p style="color:var(--text-dim);font-size:0.875rem;">No upcoming events.</p>';
  } else {
    html += `<div class="event-list">${upcoming.map(cardHtml).join('')}</div>`;
  }
  if (past.length > 0) {
    html += `<div class="past-header">Past Events</div>
      <div class="event-list" style="opacity:0.7">${past.map(cardHtml).join('')}</div>`;
  }
  el.innerHTML = html;
}

function toggleForm() {
  document.getElementById('newEventForm').classList.toggle('open');
  document.getElementById('ev_date').value = new Date().toISOString().slice(0, 10);
}

document.getElementById('eventFormEl').addEventListener('submit', async function(e) {
  e.preventDefault();
  const title = document.getElementById('ev_title').value.trim();
  const date = document.getElementById('ev_date').value;
  if (!title || !date) return;
  const gardenId = document.getElementById('ev_garden').value;
  const garden = gardenId ? gardens.find(g => g.id === gardenId) : null;
  const errEl = document.getElementById('eventFormError');
  errEl.textContent = '';
  try {
    await DataStore.addEvent({
      title, date, gardenId: gardenId || null,
      gardenName: garden ? garden.name : '',
      type: document.getElementById('ev_type').value,
      description: document.getElementById('ev_desc').value.trim(),
      openSignup: true, signups: []
    });
    events = await DataStore.getEvents();
    document.getElementById('eventSuccess').classList.add('visible');
    renderEvents();
    setTimeout(() => {
      document.getElementById('newEventForm').classList.remove('open');
      document.getElementById('eventFormEl').reset();
      document.getElementById('eventSuccess').classList.remove('visible');
    }, 1200);
  } catch (err) {
    errEl.textContent = 'Could not create event. ' + err.message;
  }
});

function openEditEvent(id) {
  const ev = events.find(x => x.id === id);
  if (!ev) return;
  document.getElementById('editEventError').textContent = '';
  document.getElementById('ee_id').value = ev.id;
  document.getElementById('ee_title').value = ev.title || '';
  document.getElementById('ee_type').value = ev.type || 'workday';
  document.getElementById('ee_date').value = ev.date || '';
  document.getElementById('ee_location').value = ev.location || ev.gardenName || '';
  document.getElementById('ee_desc').value = ev.description || '';
  document.getElementById('ee_vol_count').value = ev.volunteerCount || '';
  document.getElementById('editEventModal').classList.add('open');
}
function closeEditEvent() {
  document.getElementById('editEventModal').classList.remove('open');
}
document.getElementById('editEventModal').addEventListener('click', function(e) {
  if (e.target === this) closeEditEvent();
});
document.getElementById('editEventForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const id = document.getElementById('ee_id').value;
  const title = document.getElementById('ee_title').value.trim();
  const date = document.getElementById('ee_date').value;
  if (!title || !date) return;
  const errEl = document.getElementById('editEventError');
  errEl.textContent = '';
  try {
    await DataStore.updateEvent(id, {
      title,
      type: document.getElementById('ee_type').value,
      date,
      location: document.getElementById('ee_location').value.trim(),
      gardenName: document.getElementById('ee_location').value.trim(),
      description: document.getElementById('ee_desc').value.trim(),
      volunteerCount: parseInt(document.getElementById('ee_vol_count').value) || null
    });
    events = await DataStore.getEvents();
    closeEditEvent();
    renderEvents();
  } catch (err) {
    errEl.textContent = 'Could not save changes. ' + err.message;
  }
});

async function quickSignup(eventId) {
  const name = prompt('Enter your name to sign up:');
  if (!name || !name.trim()) return;
  const errEl = document.getElementById('eventPageError');
  errEl.textContent = '';
  try {
    await DataStore.signupForEvent(eventId, name.trim());
    events = await DataStore.getEvents();
    renderEvents();
  } catch (err) {
    errEl.textContent = 'Could not sign up. ' + err.message;
  }
}

(async function init() {
  try {
    await AuthManager.requireAuth();
    Nav.render();
    [events, gardens] = await Promise.all([DataStore.getEvents(), DataStore.getGardens()]);
    populateGardenDropdown();
    renderEvents();
  } catch (err) {
    document.getElementById('eventList').innerHTML =
      '<p style="color:var(--text-dim);font-size:0.875rem;">Could not load data (' +
      esc(err.message) + '). <a href="javascript:location.reload()">Retry</a></p>';
  }
})();
</script>
</body>
</html>
