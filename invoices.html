<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoices - Ecotopia</title>
<meta name="robots" content="noindex">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="assets/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/mapping.js"></script>
<script src="assets/auth.js"></script>
<script>if (!AuthManager.hasCachedSession()) location.replace('login.html');</script>
<script src="assets/data.js"></script>
<script src="assets/nav.js"></script>
<style>
  :root {
    --forest: #1B4332; --forest-mid: #2D6A4F; --forest-light: #52B788;
    --sage: #D8F3DC; --sage-dim: #B7E4C7; --earth: #8B5E3C;
    --earth-light: #C68642; --gold: #F4A261; --cream: #F9F6F0;
    --cream-dim: #E8E0D5; --text: #1C1C1C; --text-dim: #5A5A5A;
    --border: rgba(45,106,79,0.2);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); }
  .page { padding: 28px 32px; max-width: 1000px; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  h1 { font-family: 'Fraunces', serif; font-size: 1.9rem; color: var(--forest); }
  .btn { padding: 9px 16px; border-radius: 8px; border: none; font-size: 0.82rem;
    font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif;
    text-decoration: none; display: inline-flex; gap: 5px; align-items: center;
    transition: background 0.15s; }
  .btn-primary { background: var(--forest); color: #fff; }
  .btn-primary:hover { background: var(--forest-mid); }
  .btn-outline { background: #fff; color: var(--forest); border: 1.5px solid var(--forest-light); }
  .btn-outline:hover { background: var(--sage); }
  .btn-sm { padding: 5px 10px; font-size: 0.75rem; }

  /* Summary stats */
  .stats-row { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat-box { background: #fff; border-radius: 10px; border: 1px solid var(--border);
    padding: 14px 18px; flex: 1; min-width: 140px; }
  .stat-box .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-dim); font-weight: 700; margin-bottom: 4px; }
  .stat-box .value { font-family: 'Fraunces', serif; font-size: 1.6rem; color: var(--forest); }
  .stat-box.red .value { color: #dc2626; }
  .stat-box.green .value { color: var(--forest-light); }

  /* Table */
  .inv-table { width: 100%; border-collapse: collapse; background: #fff;
    border-radius: 14px; overflow: hidden; border: 1px solid var(--border); }
  .inv-table th { padding: 11px 16px; text-align: left; font-size: 0.75rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim);
    background: var(--cream-dim); border-bottom: 1px solid var(--border); }
  .inv-table td { padding: 13px 16px; border-bottom: 1px solid var(--border); font-size: 0.875rem;
    vertical-align: middle; }
  .inv-table tr:last-child td { border-bottom: none; }

  .status-pill { padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
  .pill-draft { background: var(--cream-dim); color: var(--text-dim); }
  .pill-sent { background: #dbeafe; color: #1e40af; }
  .pill-paid { background: #d1fae5; color: #065f46; }
  .pill-overdue { background: #fee2e2; color: #dc2626; }

  .actions-cell { display: flex; gap: 6px; }

  /* Payment modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    z-index: 500; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 16px; padding: 28px;
    width: 100%; max-width: 420px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .modal h2 { font-family: 'Fraunces', serif; color: var(--forest); margin-bottom: 12px; }
  .modal .modal-icon { font-size: 3rem; margin-bottom: 12px; }
  .modal p { font-size: 0.9rem; color: var(--text-dim); margin-bottom: 20px; line-height: 1.6; }
  .modal-actions { display: flex; gap: 10px; justify-content: center; }
  .btn-cancel { background: var(--cream-dim); color: var(--text); padding: 10px 18px;
    border-radius: 8px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; }

  /* Edit invoice modal */
  .edit-modal { text-align: left; max-width: 440px; }
  .edit-modal .modal-actions { justify-content: flex-end; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 0.82rem; font-weight: 600;
    color: var(--text-dim); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 9px 12px; border-radius: 7px;
    border: 1.5px solid var(--border); font-size: 0.9rem; font-family: 'DM Sans', sans-serif; color: var(--text);
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: var(--forest-light);
  }
  /* Edit button */
  .btn-edit { font-size: 0.75rem; padding: 4px 9px; background: transparent;
    border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
    color: var(--text-dim); font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .btn-edit:hover { color: var(--forest); border-color: var(--forest-light); background: var(--sage); }

  .modal-error { color: #b3261e; font-size: 0.85rem; margin-top: 8px; }

  @media (max-width: 700px) {
    .page { padding: 20px 16px; }
    .inv-table { font-size: 0.8rem; }
    .inv-table th, .inv-table td { padding: 9px 10px; }
    .actions-cell { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <h1>Invoices</h1>
  </div>

  <div class="stats-row" id="statsRow"></div>

  <div class="modal-error" id="invPageError" style="margin-bottom:12px;"></div>

  <table class="inv-table">
    <thead><tr>
      <th>Client</th><th>Job</th><th>Amount</th><th>Status</th><th>Due Date</th><th>Actions</th>
    </tr></thead>
    <tbody id="invBody"></tbody>
  </table>
</div>

<!-- Edit Invoice Modal -->
<div class="modal-overlay" id="editInvModal">
  <div class="modal edit-modal">
    <h2>Edit Invoice</h2>
    <form id="editInvForm" novalidate>
      <div class="form-group"><label>Amount ($)</label>
        <input type="number" id="ei_amount" min="0" step="0.01" placeholder="0.00"></div>
      <div class="form-group"><label>Due Date</label>
        <input type="date" id="ei_due"></div>
      <div class="form-group"><label>Notes</label>
        <textarea id="ei_notes" rows="2" placeholder="Invoice notes…"></textarea></div>
      <div class="form-group"><label>Status</label>
        <select id="ei_status">
          <option value="draft">Draft</option>
          <option value="sent">Sent</option>
          <option value="paid">Paid</option>
          <option value="overdue">Overdue</option>
        </select></div>
      <input type="hidden" id="ei_id">
      <div class="modal-error" id="editInvError"></div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeEditInv()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<!-- Payment Link Modal -->
<div class="modal-overlay" id="payModal">
  <div class="modal">
    <div class="modal-icon">💳</div>
    <h2>Send Payment Link</h2>
    <p>Payment processor integration coming soon.<br>
    When enabled, a payment link will be sent automatically via <strong>text and email</strong> to the client.</p>
    <p style="background:var(--cream-dim);padding:10px;border-radius:8px;font-size:0.82rem;font-weight:600;color:var(--forest)">
      Planned integrations: Square, Stripe, or PayPal</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closePayModal()">Close</button>
    </div>
  </div>
</div>

<script>
const esc = DataStore.esc;
let invoices = [];

function renderStats() {
  const total = invoices.reduce((s, i) => s + (i.amount || 0), 0);
  const paid = invoices.filter(i => i.status === 'paid').reduce((s, i) => s + (i.amount || 0), 0);
  const overdue = invoices.filter(i => i.status === 'overdue').reduce((s, i) => s + (i.amount || 0), 0);
  const outstanding = invoices.filter(i => i.status !== 'paid').reduce((s, i) => s + (i.amount || 0), 0);
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-box"><div class="label">Total Invoiced</div><div class="value">$${total.toLocaleString()}</div></div>
    <div class="stat-box green"><div class="label">Collected</div><div class="value">$${paid.toLocaleString()}</div></div>
    <div class="stat-box"><div class="label">Outstanding</div><div class="value">$${outstanding.toLocaleString()}</div></div>
    ${overdue > 0 ? `<div class="stat-box red"><div class="label">Overdue</div><div class="value">$${overdue.toLocaleString()}</div></div>` : ''}
  `;
}

function renderTable() {
  const sorted = [...invoices].sort((a, b) => {
    const order = { overdue: 0, sent: 1, draft: 2, paid: 3 };
    return (order[a.status] ?? 9) - (order[b.status] ?? 9);
  });
  document.getElementById('invBody').innerHTML = sorted.map(inv => `
    <tr>
      <td><strong>${esc(inv.clientName)}</strong></td>
      <td>${inv.jobTitle ? esc(inv.jobTitle) : '-'}</td>
      <td><strong>$${inv.amount?.toFixed(2)}</strong></td>
      <td><span class="status-pill pill-${esc(inv.status)}">${esc(inv.status.charAt(0).toUpperCase() + inv.status.slice(1))}</span></td>
      <td>${inv.dueDate ? DataStore.formatDate(inv.dueDate + 'T00:00:00') : '-'}</td>
      <td>
        <div class="actions-cell">
          <button class="btn-edit" onclick="openEditInv('${inv.id}')">✏️ Edit</button>
          ${inv.status !== 'paid' ? `
            <button class="btn btn-outline btn-sm" onclick="openPayModal()">Send Link</button>
            <button class="btn btn-primary btn-sm" onclick="markPaid('${inv.id}')">Mark Paid</button>
          ` : '<span style="color:var(--forest-light);font-size:0.8rem;font-weight:600;">✓ Paid</span>'}
        </div>
      </td>
    </tr>`).join('');
}

function render() {
  renderStats();
  renderTable();
}

function openEditInv(id) {
  const inv = invoices.find(i => i.id === id);
  if (!inv) return;
  document.getElementById('editInvError').textContent = '';
  document.getElementById('ei_id').value = inv.id;
  document.getElementById('ei_amount').value = inv.amount != null ? inv.amount.toFixed(2) : '';
  document.getElementById('ei_due').value = inv.dueDate || '';
  document.getElementById('ei_notes').value = inv.notes || '';
  document.getElementById('ei_status').value = inv.status || 'draft';
  document.getElementById('editInvModal').classList.add('open');
}
function closeEditInv() {
  document.getElementById('editInvModal').classList.remove('open');
}
document.getElementById('editInvModal').addEventListener('click', function(e) {
  if (e.target === this) closeEditInv();
});
document.getElementById('editInvForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const id = document.getElementById('ei_id').value;
  const amount = parseFloat(document.getElementById('ei_amount').value);
  const errEl = document.getElementById('editInvError');
  errEl.textContent = '';
  try {
    await DataStore.updateInvoice(id, {
      amount: isNaN(amount) ? 0 : amount,
      dueDate: document.getElementById('ei_due').value || null,
      notes: document.getElementById('ei_notes').value.trim(),
      status: document.getElementById('ei_status').value
    });
    invoices = await DataStore.getInvoices();
    closeEditInv();
    render();
  } catch (err) {
    errEl.textContent = 'Could not save changes. ' + err.message;
  }
});

async function markPaid(id) {
  if (!confirm('Mark this invoice as paid?')) return;
  const errEl = document.getElementById('invPageError');
  errEl.textContent = '';
  try {
    await DataStore.markInvoicePaid(id);
    invoices = await DataStore.getInvoices();
    render();
  } catch (err) {
    errEl.textContent = 'Could not mark invoice paid. ' + err.message;
  }
}

function openPayModal() { document.getElementById('payModal').classList.add('open'); }
function closePayModal() { document.getElementById('payModal').classList.remove('open'); }
document.getElementById('payModal').addEventListener('click', function(e) {
  if (e.target === this) closePayModal();
});

(async function init() {
  try {
    await AuthManager.requireAuth();
    Nav.render();
    invoices = await DataStore.getInvoices();
    render();
  } catch (err) {
    document.getElementById('invBody').innerHTML =
      '<tr><td colspan="6" style="text-align:center;color:var(--text-dim);padding:20px">Could not load data (' +
      esc(err.message) + '). <a href="javascript:location.reload()">Retry</a></td></tr>';
  }
})();
</script>

</html>
