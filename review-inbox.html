<style>
  :root {
    --forest: #1B4332; --forest-mid: #2D6A4F; --forest-light: #52B788;
    --sage: #D8F3DC; --sage-dim: #B7E4C7; --earth: #8B5E3C;
    --earth-light: #C68642; --gold: #F4A261; --cream: #F9F6F0;
    --cream-dim: #E8E0D5; --text: #1C1C1C; --text-dim: #5A5A5A;
    --border: rgba(45,106,79,0.2); --amber: #B8730A; --amber-bg: #FDF0DA;
    --blue: #1d4ed8; --blue-bg: #dbeafe;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); }
  .page { padding: 28px 32px; max-width: 900px; }
  .page-header { margin-bottom: 6px; }
  h1 { font-family: 'Fraunces', serif; font-size: 1.9rem; color: var(--forest); }
  .page-intro { font-size: 0.9rem; color: var(--text-dim); margin-bottom: 22px;
    max-width: 680px; line-height: 1.6; }

  .btn-sm { font-size: 0.78rem; padding: 6px 12px; background: transparent;
    border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
    color: var(--text-dim); font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .btn-sm:hover { color: var(--forest); border-color: var(--forest-light); background: var(--sage); }
  .btn-sm.btn-primary { background: var(--forest); color: #fff; border-color: var(--forest); }
  .btn-sm.btn-primary:hover { background: var(--forest-mid); color: #fff; }
  .btn-sm.btn-danger { color: #b3261e; }
  .btn-sm.btn-danger:hover { color: #fff; background: #b3261e; border-color: #b3261e; }

  .group-h { font-family: 'Fraunces', serif; font-size: 1.15rem; color: var(--forest);
    margin: 26px 0 12px; display: flex; align-items: center; gap: 10px; }
  .group-h .count { font-family: 'DM Sans', sans-serif; font-size: 0.8rem; color: var(--text-dim);
    font-weight: 600; }
  .group-h:first-of-type { margin-top: 8px; }

  .q-list { display: flex; flex-direction: column; gap: 12px; }
  .q-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .q-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .status-pill { display: inline-block; padding: 2px 10px; border-radius: 20px;
    font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
  .status-pending { background: var(--amber-bg); color: var(--amber); }
  .status-approved { background: var(--sage); color: var(--forest); }
  .status-dismissed { background: var(--cream-dim); color: var(--text-dim); }
  .q-stars { color: #d99a1c; font-size: 1.05rem; letter-spacing: 2px; }
  .q-stars .empty { color: var(--cream-dim); }
  .q-date { font-size: 0.78rem; color: var(--text-dim); margin-left: auto; }
  .q-who { font-size: 0.9rem; color: var(--text); font-weight: 600; margin-bottom: 2px; }
  .q-who .loc { font-weight: 400; color: var(--text-dim); }
  .q-service { font-size: 0.78rem; color: var(--forest-mid); margin-bottom: 8px; }
  .q-text { font-size: 0.98rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
    background: var(--cream); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  .q-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .q-actions .spacer { flex: 1; }

  .empty { padding: 40px 16px; color: var(--text-dim); font-size: 0.95rem; text-align: center; }
  #pageError { color: #b3261e; font-size: 0.85rem; margin-bottom: 14px; }
  #pageError:empty { display: none; }

  @media (max-width: 700px) {
    .page { padding: 20px 16px; }
    .q-date { margin-left: 0; }
  }
</style>

<body>
<div class="page">
  <div class="page-header">
    <h1>Reviews</h1>
  </div>
  <p class="page-intro">First-party reviews from the public
    (<a href="reviews.html" target="_blank" rel="noopener">reviews</a>) page. Approve a review to show it
    publicly on the site, dismiss the ones that should not appear, or delete. Pending reviews are shown
    first. Only approved reviews are ever visible to the public.</p>

  <div id="pageError"></div>
  <div id="inbox"><div class="empty">Loading…</div></div>
</div>

<script>
const esc = DataStore.esc;

// Group order + labels. Pending first, then approved, then dismissed.
const GROUPS = [
  { key: 'pending',   label: 'Pending' },
  { key: 'approved',  label: 'Approved (shown publicly)' },
  { key: 'dismissed', label: 'Dismissed' },
];
const STATUS_ALLOW = { pending: 1, approved: 1, dismissed: 1 };

let reviews = [];

// Read-only star row: n filled of 5. Numeric input, no user string to escape.
function starRow(rating) {
  const n = Math.max(0, Math.min(5, Math.round(Number(rating) || 0)));
  let out = '';
  for (let i = 1; i <= 5; i++) out += i <= n ? '★' : '<span class="empty">☆</span>';
  return out;
}

function whoLine(r) {
  const name = (r.name || '').trim();
  const loc = (r.location || '').trim();
  let out = name ? esc(name) : 'Anonymous';
  if (loc) out += '<span class="loc"> · ' + esc(loc) + '</span>';
  return out;
}

function card(r) {
  const cls = STATUS_ALLOW[r.status] ? r.status : 'pending';
  const service = (r.service || '').trim();
  const svc = service ? '<div class="q-service">' + esc(service) + '</div>' : '';
  const rated = Math.round(Number(r.rating) || 0);
  return `
    <div class="q-card">
      <div class="q-top">
        <span class="status-pill status-${cls}">${esc(GROUPS.find(g => g.key === cls).label)}</span>
        <span class="q-stars" aria-label="${esc(String(rated))} out of 5 stars">${starRow(r.rating)}</span>
        <span class="q-date">${esc(DataStore.formatDate(r.createdAt))}</span>
      </div>
      <div class="q-who">${whoLine(r)}</div>
      ${svc}
      <div class="q-text">${esc(r.body)}</div>
      <div class="q-actions">
        ${cls !== 'approved' ? `<button class="btn-sm btn-primary" onclick="setStatus('${esc(r.id)}','approved')">Approve</button>` : ''}
        ${cls !== 'dismissed' ? `<button class="btn-sm" onclick="setStatus('${esc(r.id)}','dismissed')">Dismiss</button>` : ''}
        <span class="spacer"></span>
        <button class="btn-sm btn-danger" onclick="removeReview('${esc(r.id)}')">Delete</button>
      </div>
    </div>`;
}

function render() {
  const el = document.getElementById('inbox');
  if (!reviews.length) {
    el.innerHTML = '<div class="empty">No reviews yet. When someone leaves one on the public page, it lands here.</div>';
    return;
  }
  let html = '';
  GROUPS.forEach(g => {
    const rows = reviews.filter(r => (STATUS_ALLOW[r.status] ? r.status : 'pending') === g.key);
    if (!rows.length) return;
    html += `<h2 class="group-h">${esc(g.label)} <span class="count">${rows.length}</span></h2>` +
      '<div class="q-list">' + rows.map(card).join('') + '</div>';
  });
  el.innerHTML = html;
}

function reviewById(id) { return reviews.find(r => r.id === id); }

async function setStatus(id, status) {
  if (!STATUS_ALLOW[status]) return;
  const errEl = document.getElementById('pageError');
  errEl.textContent = '';
  try {
    await DataStore.updateReview(id, { status });
    await load();
  } catch (err) {
    errEl.textContent = 'Could not update. ' + err.message;
  }
}

async function removeReview(id) {
  const r = reviewById(id);
  if (!r) return;
  if (!confirm('Delete this review permanently?')) return;
  const errEl = document.getElementById('pageError');
  errEl.textContent = '';
  try {
    await DataStore.deleteReview(id);
    await load();
  } catch (err) {
    errEl.textContent = 'Could not delete. ' + err.message;
  }
}

async function load() {
  reviews = await DataStore.getReviews();
  render();
}

(async function init() {
  try {
    await AuthManager.requireAuth();
    Nav.render();
    await load();
  } catch (err) {
    document.getElementById('inbox').innerHTML =
      '<div class="empty">Could not load reviews (' + esc(err.message) +
      '). <a href="javascript:location.reload()">Retry</a></div>';
  }
})();
</script>
