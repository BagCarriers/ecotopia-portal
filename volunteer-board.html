<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Responsibilities — Ecotopia</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="assets/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/mapping.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/data.js"></script>
<style>
  :root {
    --forest: #1B4332; --forest-mid: #2D6A4F; --forest-light: #52B788;
    --sage: #D8F3DC; --sage-dim: #B7E4C7; --earth: #8B5E3C;
    --earth-light: #C68642; --gold: #F4A261; --cream: #F9F6F0;
    --cream-dim: #E8E0D5; --text: #1C1C1C; --text-dim: #5A5A5A;
    --border: rgba(45,106,79,0.2);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); }

  /* Public header */
  .pub-header {
    background: var(--forest); padding: 20px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .pub-logo { font-family: 'Fraunces', serif; font-size: 1.2rem; color: var(--sage); font-weight: 700; }
  .pub-tagline { font-size: 0.8rem; color: rgba(216,243,220,0.7); margin-top: 2px; }

  .container { max-width: 860px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-family: 'Fraunces', serif; font-size: 2rem; color: var(--forest); margin-bottom: 8px; }
  .intro { font-size: 0.95rem; color: var(--text-dim); margin-bottom: 32px; line-height: 1.6;
    max-width: 620px; }

  /* Garden sections */
  .garden-section { margin-bottom: 40px; }
  .garden-name { font-family: 'Fraunces', serif; font-size: 1.3rem; color: var(--forest);
    margin-bottom: 4px; }
  .garden-addr { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 16px; }

  .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .task-card {
    background: #fff; border-radius: 14px; border: 1px solid var(--border); padding: 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .task-card-title { font-weight: 700; font-size: 0.95rem; color: var(--forest); }
  .task-meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .meta-pill { padding: 3px 9px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; }
  .pill-cadence { background: var(--cream-dim); color: var(--text-dim); }
  .pill-time { background: #dbeafe; color: #1e40af; }
  .pill-skill { background: #fef3c7; color: #92400e; }
  .btn-claim {
    background: var(--forest); color: #fff; border: none; border-radius: 8px;
    padding: 10px; font-size: 0.875rem; font-weight: 700; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: background 0.15s; width: 100%; margin-top: 4px;
  }
  .btn-claim:hover { background: var(--forest-mid); }

  /* Claim form */
  .claim-form { display: none; background: var(--sage); border-radius: 10px;
    padding: 14px; margin-top: 4px; }
  .claim-form.open { display: block; }
  .claim-form h4 { font-size: 0.875rem; font-weight: 700; color: var(--forest); margin-bottom: 10px; }
  .cf-group { margin-bottom: 10px; }
  .cf-group label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--forest-mid);
    margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  .cf-group input, .cf-group select {
    width: 100%; padding: 9px 10px; border-radius: 7px; border: 1.5px solid var(--border);
    font-size: 0.875rem; font-family: 'DM Sans', sans-serif; background: #fff;
  }
  .cf-group input:focus, .cf-group select:focus { outline: none; border-color: var(--forest); }
  .cf-actions { display: flex; gap: 8px; }
  .btn-submit { background: var(--forest); color: #fff; border: none; border-radius: 7px;
    padding: 9px 16px; font-size: 0.82rem; font-weight: 700; cursor: pointer;
    font-family: 'DM Sans', sans-serif; flex: 1; }
  .btn-cancel { background: #fff; color: var(--forest); border: 1px solid var(--border);
    border-radius: 7px; padding: 9px 12px; font-size: 0.82rem; cursor: pointer;
    font-family: 'DM Sans', sans-serif; }
  .claimed-badge { background: #d1fae5; color: #065f46; padding: 10px; border-radius: 8px;
    font-size: 0.875rem; font-weight: 600; text-align: center; }

  .empty-tasks { color: var(--text-dim); font-size: 0.875rem; font-style: italic; }
  .claim-error { color: #b3261e; font-size: 0.8rem; margin-top: 8px; }

  @media (max-width: 540px) {
    .task-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="pub-header">
  <div>
    <div class="pub-logo">🌿 Ecotopia Earthcare</div>
    <div class="pub-tagline">Community Garden Program</div>
  </div>
</div>

<div class="container">
  <h1>Open Responsibilities</h1>
  <p class="intro">These tasks need a regular volunteer. Each one has an estimated time and cadence.
    If something feels right for your schedule, tap "I'll take this" to sign up.</p>

  <div id="boardContent"></div>
</div>

<script>
const esc = DataStore.esc;
const claimedTasks = {};
let gardens = [];
let allTasks = [];

function cadenceLabel(days) {
  if (days <= 2) return `${days}x/wk`;
  if (days <= 7) return 'Weekly';
  if (days <= 14) return 'Biweekly';
  if (days <= 30) return 'Monthly';
  return `Every ${days}d`;
}
function timeLabel(mins) {
  return mins >= 60 ? `${(mins/60).toFixed(1)}h` : `${mins}min`;
}

function renderBoard() {
  const el = document.getElementById('boardContent');

  el.innerHTML = gardens.map(g => {
    const openTasks = allTasks.filter(t => t.gardenId === g.id && t.owner === 'open');
    return `
      <div class="garden-section">
        <div class="garden-name">${esc(g.name)}</div>
        <div class="garden-addr">📍 ${esc(g.address)} · ${Number(g.sqft || 0).toLocaleString()} sqft</div>
        ${openTasks.length === 0
          ? '<p class="empty-tasks">All tasks at this garden are covered. 🎉</p>'
          : `<div class="task-grid">
              ${openTasks.map(t => taskCard(t, g)).join('')}
            </div>`}
      </div>`;
  }).join('');
}

function taskCard(t, g) {
  const isClaimed = claimedTasks[t.id];
  return `
    <div class="task-card" id="card_${t.id}">
      <div class="task-card-title">${esc(t.title)}</div>
      <div class="task-meta">
        <span class="meta-pill pill-cadence">${cadenceLabel(t.cadenceDays)}</span>
        <span class="meta-pill pill-time">~${timeLabel(t.estMinutes)}</span>
        ${t.skillLevel !== 'none' ? `<span class="meta-pill pill-skill">${esc(t.skillLevel)}</span>` : ''}
      </div>
      <div style="font-size:0.8rem;color:var(--text-dim)">📍 ${esc(g.name)} · ${esc(g.address)}</div>
      ${isClaimed
        ? `<div class="claimed-badge">✓ You signed up for this!</div>`
        : `<button class="btn-claim" onclick="openClaimForm('${t.id}')">I'll take this →</button>
           <div class="claim-form" id="form_${t.id}">
             <h4>Sign up for "${esc(t.title)}"</h4>
             <div class="cf-group"><label>Your Name *</label>
               <input type="text" id="cf_name_${t.id}" placeholder="First & last name"></div>
             <div class="cf-group"><label>Phone *</label>
               <input type="tel" id="cf_phone_${t.id}" placeholder="(814) 555-0000"></div>
             <div class="cf-group"><label>Email</label>
               <input type="email" id="cf_email_${t.id}" placeholder="email@example.com"></div>
             <div class="cf-group"><label>Preferred Schedule</label>
               <input type="text" id="cf_sched_${t.id}" placeholder="e.g. Saturday mornings"></div>
             <div class="cf-actions">
               <button class="btn-cancel" onclick="closeClaimForm('${t.id}')">Cancel</button>
               <button class="btn-submit" onclick="submitClaim('${t.id}')">Submit</button>
             </div>
             <div class="claim-error" id="err_${t.id}"></div>
           </div>`}
    </div>`;
}

function openClaimForm(taskId) {
  document.getElementById('form_' + taskId).classList.add('open');
}
function closeClaimForm(taskId) {
  document.getElementById('form_' + taskId).classList.remove('open');
}

async function submitClaim(taskId) {
  const task = allTasks.find(t => t.id === taskId);
  if (!task) return;
  const garden = gardens.find(g => g.id === task.gardenId);
  const name = document.getElementById('cf_name_' + taskId).value.trim();
  const phone = document.getElementById('cf_phone_' + taskId).value.trim();
  const errEl = document.getElementById('err_' + taskId);
  if (errEl) errEl.textContent = '';
  if (!name || !phone) {
    alert('Name and phone are required.');
    return;
  }
  try {
    await DataStore.addVolunteerApplication({
      taskId,
      gardenId: task.gardenId,
      gardenName: garden ? garden.name : null,
      taskTitle: task.title,
      name, phone,
      email: document.getElementById('cf_email_' + taskId).value.trim(),
      preferredSchedule: document.getElementById('cf_sched_' + taskId).value.trim(),
      submittedAt: new Date().toISOString()
    });
  } catch (err) {
    if (errEl) errEl.textContent = 'Could not submit your sign-up. Please try again.';
    return;
  }
  claimedTasks[taskId] = true;
  renderBoard();
  // Smooth scroll to the submitted card
  setTimeout(() => {
    const card = document.getElementById('card_' + taskId);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

(async function init() {
  try {
    [gardens, allTasks] = await Promise.all([DataStore.getGardens(), DataStore.getTasks()]);
    renderBoard();
  } catch (err) {
    document.getElementById('boardContent').innerHTML =
      '<p class="empty-tasks">Could not load open tasks right now. Please refresh the page.</p>';
  }
})();
</script>
</body>
</html>
